<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <!-- Splash: the app icon (icon.svg) as a rounded tile on the app's background. -->
  <defs>
    <clipPath id="tile">
      <rect x="840" y="420" width="240" height="240" rx="48"/>
    </clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#0b0d12"/>
  <g clip-path="url(#tile)">
    <g transform="translate(840 420) scale(0.6)">
      <rect width="400" height="400" fill="#7b2ff7"/>
      <g fill="#fff">
        <rect x="116" y="88" width="66" height="34" rx="17"/>
        <rect x="116" y="136" width="132" height="34" rx="17"/>
        <rect x="116" y="184" width="196" height="34" rx="17"/>
        <rect x="116" y="232" width="132" height="34" rx="17"/>
        <rect x="116" y="280" width="66" height="34" rx="17"/>
      </g>
    </g>
  </g>
</svg>
