<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <!-- Splash: the app icon (icon.svg) as a rounded tile on the app's background. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f37c9"/>
      <stop offset="0.55" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#e5308a"/>
    </linearGradient>
    <radialGradient id="light" cx="0.22" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1a0640" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile">
      <rect x="840" y="420" width="240" height="240" rx="48"/>
    </clipPath>
  </defs>
  <rect width="1920" height="1080" fill="#0b0d12"/>
  <g clip-path="url(#tile)">
    <g transform="translate(840 420) scale(0.6)">
      <rect width="400" height="400" fill="url(#bg)"/>
      <rect width="400" height="400" fill="url(#light)"/>
      <g fill="url(#bar)" filter="url(#shadow)">
        <rect x="116" y="88" width="66" height="34" rx="17"/>
        <rect x="116" y="136" width="132" height="34" rx="17"/>
        <rect x="116" y="184" width="196" height="34" rx="17"/>
        <rect x="116" y="232" width="132" height="34" rx="17"/>
        <rect x="116" y="280" width="66" height="34" rx="17"/>
      </g>
    </g>
  </g>
</svg>
