<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Zaplist: a playlist whose lines form a play button. LG wants a square, opaque icon whose
       background is one plain color, the same as the app tile color (appinfo.json iconColor). -->
  <rect width="400" height="400" fill="#7b2ff7"/>
  <g fill="#fff">
    <rect x="116" y="88" width="66" height="34" rx="17"/>
    <rect x="116" y="136" width="132" height="34" rx="17"/>
    <rect x="116" y="184" width="196" height="34" rx="17"/>
    <rect x="116" y="232" width="132" height="34" rx="17"/>
    <rect x="116" y="280" width="66" height="34" rx="17"/>
  </g>
</svg>
